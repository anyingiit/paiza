# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `master`, so the workflow had never run on a push to it.
#   - the test job ran the starter's placeholder echo. Every solved problem is
#     its own `package main` with the computation written inline in main(), so
#     there is nothing importable to unit-test; `smoketest/smoke_test.go` was
#     added to build and run D007 and D170 as black-box programs against the
#     exact input/output pairs paiza.jp's own judge already scored (recorded
#     in D007/docment.md and D170/document.md) and assert on the printed
#     output, so a green check now proves the built programs still produce
#     the judged answer.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.18'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
